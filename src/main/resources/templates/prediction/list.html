<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(content=~{::content})}">
<head><title>My Predictions</title></head>
<body>
<th:block th:fragment="content">
    <h1 th:text="#{prediction.title}">My Predictions</h1>

    <!-- Toast -->
    <div th:if="${predictionSuccess}" class="toast toast-success" th:text="#{${predictionSuccess}}"></div>
    <div th:if="${predictionError}"   class="toast toast-error"   th:text="#{${predictionError}}"></div>

    <div th:if="${#lists.isEmpty(predictions)}" class="card">
        <p th:text="#{prediction.empty}">No predictions yet.</p>
    </div>

    <table th:if="${!#lists.isEmpty(predictions)}" class="card pred-table">
        <thead>
        <tr>
            <th th:text="#{prediction.col.match}">Match</th>
            <th th:text="#{prediction.col.date}">Date</th>
            <th th:text="#{prediction.col.mine}">My Prediction</th>
            <th th:text="#{prediction.col.result}">Result</th>
            <th th:text="#{prediction.col.points}">Points</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${predictions}"
            th:classappend="${editableIds.contains(p.id)} ? 'pred-row--editable' : ''">
            <td>
                <span th:text="${@flagUtil.get(p.match.countryA)}"></span>
                <span th:text="${p.match.countryA}"></span>
                <span class="vs-sep">vs</span>
                <span th:text="${@flagUtil.get(p.match.countryB)}"></span>
                <span th:text="${p.match.countryB}"></span>
            </td>
            <td th:text="${#temporals.format(p.match.matchDate, 'dd MMM HH:mm')}"></td>
            <td><strong th:text="${p.predictedGoalsA} + ' – ' + ${p.predictedGoalsB}"></strong></td>
            <td th:text="${p.match.goalsA != null} ? ${p.match.goalsA} + ' – ' + ${p.match.goalsB} : #{prediction.tbd}">TBD</td>
            <td>
                <span th:if="${p.pointsAwarded != null}" class="points-badge" th:text="${p.pointsAwarded} + ' pts'"></span>
                <span th:if="${p.pointsAwarded == null}" class="muted-note">–</span>
            </td>
            <td>
                <button th:if="${editableIds.contains(p.id)}"
                        class="btn btn-sm"
                        th:attr="data-match-id=${p.match.id},
                                 data-country-a=${p.match.countryA},
                                 data-country-b=${p.match.countryB},
                                 data-flag-a=${@flagUtil.get(p.match.countryA)},
                                 data-flag-b=${@flagUtil.get(p.match.countryB)},
                                 data-date=${#temporals.format(p.match.matchDate, 'dd MMM yyyy HH:mm')},
                                 data-goals-a=${p.predictedGoalsA},
                                 data-goals-b=${p.predictedGoalsB}"
                        onclick="openEditModal(this)"
                        th:text="#{prediction.edit}">Edit</button>
                <span th:if="${!editableIds.contains(p.id)}" class="locked-badge" th:text="#{prediction.locked}">Locked</span>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- Edit modal -->
    <div id="edit-overlay" class="modal-overlay" onclick="closeEditModal()">
        <div class="modal-box" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeEditModal()">✕</button>

            <!-- Hero -->
            <div class="modal-hero">
                <div class="modal-team">
                    <span id="edit-flag-a" style="font-size:36px"></span>
                    <span id="edit-country-a">Team A</span>
                </div>
                <div class="modal-score">vs</div>
                <div class="modal-team">
                    <span id="edit-flag-b" style="font-size:36px"></span>
                    <span id="edit-country-b">Team B</span>
                </div>
            </div>

            <!-- Date strip -->
            <div class="modal-meta">
                <span id="edit-date"></span>
            </div>

            <!-- Prediction form -->
            <div class="modal-body">
                <h3 th:text="#{match.detail.prediction.title}" style="margin-bottom:18px">Your Prediction</h3>
                <form id="edit-predict-form" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="redirectTo" value="/predictions"/>
                    <div class="prediction-inputs">
                        <div class="prediction-input-group">
                            <label id="edit-label-a">Team A</label>
                            <input type="number" name="goalsA" id="edit-input-a" min="0" max="99" value="0" class="goal-input" required/>
                        </div>
                        <div class="prediction-sep">–</div>
                        <div class="prediction-input-group">
                            <label id="edit-label-b">Team B</label>
                            <input type="number" name="goalsB" id="edit-input-b" min="0" max="99" value="0" class="goal-input" required/>
                        </div>
                    </div>
                    <div style="margin-top:20px">
                        <button type="submit" class="btn" th:text="#{prediction.edit.save}">Save Prediction</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        function openEditModal(btn) {
            const d = btn.dataset;
            document.getElementById('edit-flag-a').textContent    = d.flagA;
            document.getElementById('edit-flag-b').textContent    = d.flagB;
            document.getElementById('edit-country-a').textContent = d.countryA;
            document.getElementById('edit-country-b').textContent = d.countryB;
            document.getElementById('edit-label-a').textContent   = d.countryA;
            document.getElementById('edit-label-b').textContent   = d.countryB;
            document.getElementById('edit-date').textContent      = d.date;
            document.getElementById('edit-input-a').value         = d.goalsA;
            document.getElementById('edit-input-b').value         = d.goalsB;
            document.getElementById('edit-predict-form').action   = '/matches/' + d.matchId + '/predict';

            document.getElementById('edit-overlay').style.display = 'flex';
            document.getElementById('edit-input-a').focus();
        }

        function closeEditModal() {
            document.getElementById('edit-overlay').style.display = 'none';
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeEditModal();
        });
    </script>

</th:block>
</body>
</html>
