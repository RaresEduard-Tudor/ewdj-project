<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      th:replace="~{layout :: layout(content=~{::content})}">
<head><title>Matches</title></head>
<body>
<th:block th:fragment="content">
    <h1 th:text="#{match.list.title}">All Matches</h1>

    <!-- Toast notifications -->
    <div th:if="${predictionSuccess}" class="toast toast-success" th:text="#{${predictionSuccess}}"></div>
    <div th:if="${predictionError}"   class="toast toast-error"   th:text="#{${predictionError}}"></div>

    <!-- Filters -->
    <div th:if="${!#lists.isEmpty(matches)}" class="filter-bar">
        <input type="text" id="filter-search" class="filter-input" placeholder="Search country..." oninput="applyFilters()"/>
        <input type="date" id="filter-date" class="filter-input" oninput="applyFilters()"/>
        <select id="filter-status" class="filter-input" onchange="applyFilters()">
            <option value="" th:text="#{match.filter.all}">All</option>
            <option value="upcoming" th:text="#{match.filter.upcoming}">Upcoming</option>
            <option value="final" th:text="#{match.filter.final}">Final</option>
        </select>
        <button class="btn btn-sm" onclick="clearFilters()" th:text="#{match.filter.clear}">Clear</button>
    </div>

    <div th:if="${#lists.isEmpty(matches)}" class="empty-state">
        <span class="empty-state__icon">⚽</span>
        <div class="empty-state__title" th:text="#{match.list.empty}">No matches scheduled yet.</div>
    </div>

    <p id="no-filter-results" class="muted-note" style="display:none" th:text="#{match.filter.no.results}">No matches found.</p>

    <div th:if="${!#lists.isEmpty(matches)}" id="matches-container">
        <div th:each="match : ${matches}"
             class="match-card match-card--clickable"
             th:attr="data-id=${match.id},
                      data-country-a=${match.countryA},
                      data-country-b=${match.countryB},
                      data-flag-a=${@flagUtil.get(match.countryA)},
                      data-flag-b=${@flagUtil.get(match.countryB)},
                      data-date=${#temporals.format(match.matchDate, 'dd MMM yyyy HH:mm')},
                      data-iso-date=${#temporals.format(match.matchDate, 'yyyy-MM-dd')},
                      data-city=${match.city},
                      data-stadium=${match.stadium},
                      data-goals-a=${match.goalsA != null ? match.goalsA : ''},
                      data-goals-b=${match.goalsB != null ? match.goalsB : ''},
                      data-pred-a=${userPredictions != null and userPredictions[match.id] != null ? userPredictions[match.id].predictedGoalsA : ''},
                      data-pred-b=${userPredictions != null and userPredictions[match.id] != null ? userPredictions[match.id].predictedGoalsB : ''}"
             onclick="openMatchModal(this)">
            <div class="match-card__date">
                <span th:text="${#temporals.format(match.matchDate, 'dd MMM')}"></span>
                <small th:text="${#temporals.format(match.matchDate, 'HH:mm')}"></small>
            </div>
            <div class="match-card__teams">
                <span class="team-name">
                    <span th:text="${@flagUtil.get(match.countryA)}"></span>
                    <span th:text="${match.countryA}"></span>
                </span>
                <span class="vs-badge"
                      th:text="${match.goalsA != null} ? ${match.goalsA} + ' – ' + ${match.goalsB} : #{match.vs}"></span>
                <span class="team-name">
                    <span th:text="${@flagUtil.get(match.countryB)}"></span>
                    <span th:text="${match.countryB}"></span>
                </span>
            </div>
            <div class="match-card__meta">
                <span th:text="${match.stadium}"></span>
                <span class="dot">·</span>
                <span th:text="${match.city}"></span>
            </div>
            <div class="match-card__action">
                <span th:if="${match.goalsA != null}" class="badge badge-done" th:text="#{badge.final}">Final</span>
                <span th:if="${match.goalsA == null}" class="badge badge-upcoming" th:text="#{badge.upcoming}">Upcoming</span>
            </div>
        </div>
    </div>

    <!-- ── Modal ─────────────────────────────────────────────── -->
    <div id="match-modal" class="modal-overlay" onclick="handleOverlayClick(event)">
        <div class="modal-box">
            <button class="modal-close" onclick="closeMatchModal()">&times;</button>

            <div class="modal-hero">
                <div class="modal-team" id="modal-team-a"></div>
                <div class="modal-score" id="modal-score" th:text="#{match.vs}">vs</div>
                <div class="modal-team" id="modal-team-b"></div>
            </div>

            <div class="modal-meta" id="modal-meta"></div>

            <!-- Existing prediction banner -->
            <div id="modal-existing-prediction" class="modal-existing-prediction" style="display:none">
                <span th:text="#{match.detail.prediction.current}">Current prediction</span>:
                <strong id="modal-existing-score"></strong>
                <span id="modal-existing-points" class="points-badge" style="display:none"></span>
            </div>

            <div class="modal-body">
                <!-- Authenticated: prediction form -->
                <div sec:authorize="isAuthenticated()" id="modal-predict-section">
                    <h3 th:text="#{match.detail.prediction.title}" style="margin-bottom:16px">Your Prediction</h3>
                    <form id="modal-predict-form" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <div class="prediction-inputs">
                            <div class="prediction-input-group">
                                <label id="modal-label-a">Team A</label>
                                <input type="number" name="goalsA" id="modal-input-a" min="0" value="0" class="goal-input" required/>
                            </div>
                            <div class="prediction-sep">–</div>
                            <div class="prediction-input-group">
                                <label id="modal-label-b">Team B</label>
                                <input type="number" name="goalsB" id="modal-input-b" min="0" value="0" class="goal-input" required/>
                            </div>
                        </div>
                        <button type="submit" class="btn" th:text="#{match.detail.prediction.submit}">Submit Prediction</button>
                    </form>
                </div>

                <!-- Not authenticated -->
                <div sec:authorize="!isAuthenticated()" style="text-align:center;padding:8px 0">
                    <a th:href="@{/login}" class="btn" th:text="#{nav.login}">Login to predict</a>
                </div>

                <!-- Admin edit -->
                <div sec:authorize="hasRole('ADMIN')" style="text-align:center;margin-top:12px">
                    <a id="modal-edit-link" href="#" class="btn btn-admin" th:text="#{match.admin.edit}">Edit</a>
                </div>

                <!-- Match ended -->
                <p id="modal-ended-msg" class="muted-note" style="display:none"
                   th:text="#{match.detail.ended}">This match has ended.</p>
            </div>
        </div>
    </div>

    <script>
        function openMatchModal(card) {
            const d = card.dataset;
            const hasResult = d.goalsA !== '' && d.goalsA !== undefined;
            const hasPrediction = d.predA !== '' && d.predA !== undefined;

            // Hero
            document.getElementById('modal-team-a').innerHTML =
                '<span class="hero-flag">' + d.flagA + '</span>' + d.countryA;
            document.getElementById('modal-team-b').innerHTML =
                '<span class="hero-flag">' + d.flagB + '</span>' + d.countryB;
            document.getElementById('modal-score').textContent =
                hasResult ? d.goalsA + ' \u2013 ' + d.goalsB : 'vs';

            // Meta
            document.getElementById('modal-meta').textContent =
                d.date + '\u2002\u00b7\u2002' + d.city + '\u2002\u00b7\u2002' + d.stadium;

            // Existing prediction
            const existingEl = document.getElementById('modal-existing-prediction');
            const existingScore = document.getElementById('modal-existing-score');
            const existingPts = document.getElementById('modal-existing-points');
            if (hasPrediction) {
                existingScore.textContent = d.predA + ' \u2013 ' + d.predB;
                existingPts.style.display = 'none';
                existingEl.style.display = 'flex';
            } else {
                existingEl.style.display = 'none';
            }

            // Labels & form action
            const labelA = document.getElementById('modal-label-a');
            const labelB = document.getElementById('modal-label-b');
            const inputA = document.getElementById('modal-input-a');
            const inputB = document.getElementById('modal-input-b');
            if (labelA) labelA.textContent = d.countryA;
            if (labelB) labelB.textContent = d.countryB;
            if (inputA) inputA.value = hasPrediction ? d.predA : 0;
            if (inputB) inputB.value = hasPrediction ? d.predB : 0;

            const form = document.getElementById('modal-predict-form');
            if (form) form.action = '/matches/' + d.id + '/predict';

            const editLink = document.getElementById('modal-edit-link');
            if (editLink) editLink.href = '/admin/matches/' + d.id + '/edit';

            // Show/hide sections
            const predictSection = document.getElementById('modal-predict-section');
            const endedMsg       = document.getElementById('modal-ended-msg');
            if (predictSection) predictSection.style.display = hasResult ? 'none' : 'block';
            if (endedMsg)       endedMsg.style.display       = hasResult ? 'block' : 'none';

            document.getElementById('match-modal').classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeMatchModal() {
            document.getElementById('match-modal').classList.remove('open');
            document.body.style.overflow = '';
        }

        function handleOverlayClick(e) {
            if (e.target === e.currentTarget) closeMatchModal();
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeMatchModal();
        });

        function applyFilters() {
            const search = document.getElementById('filter-search').value.toLowerCase();
            const date = document.getElementById('filter-date').value;
            const status = document.getElementById('filter-status').value;
            const cards = document.querySelectorAll('#matches-container .match-card');
            let visible = 0;
            cards.forEach(card => {
                const d = card.dataset;
                const matchesSearch = !search ||
                    d.countryA.toLowerCase().includes(search) ||
                    d.countryB.toLowerCase().includes(search);
                const matchesDate = !date || d.isoDate === date;
                const hasFinal = d.goalsA !== '' && d.goalsA !== undefined;
                const matchesStatus = !status ||
                    (status === 'final' && hasFinal) ||
                    (status === 'upcoming' && !hasFinal);
                const show = matchesSearch && matchesDate && matchesStatus;
                card.style.display = show ? '' : 'none';
                if (show) visible++;
            });
            document.getElementById('no-filter-results').style.display = visible === 0 ? 'block' : 'none';
        }

        function clearFilters() {
            document.getElementById('filter-search').value = '';
            document.getElementById('filter-date').value = '';
            document.getElementById('filter-status').value = '';
            applyFilters();
        }
    </script>
</th:block>
</body>
</html>
