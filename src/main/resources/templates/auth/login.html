<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(content=~{::content})}">
<head><title>Login</title></head>
<body>
<th:block th:fragment="content">
    <div class="card" style="max-width:400px;margin:0 auto">
        <h1 th:text="#{login.title}">Login</h1>
        <div th:if="${param.error}" class="alert-error" th:text="#{login.error}">Invalid username or password.</div>
        <div th:if="${param.registered}" class="success-msg" th:text="#{login.registered}">Registration successful! Please log in.</div>
        <form th:action="@{/login}" method="post">
            <label th:text="#{login.username.label}">Username</label>
            <input type="text" name="username" required/>
            <label th:text="#{login.password.label}">Password</label>
            <input type="password" name="password" required/>
            <button type="submit" class="btn" th:text="#{login.submit}">Login</button>
        </form>
        <p style="margin-top:12px">
            <span th:text="#{login.no.account}">Don't have an account?</span>
            <a th:href="@{/register}" th:text="#{login.register.link}">Register here</a>
        </p>
    </div>
</th:block>
</body>
</html>
