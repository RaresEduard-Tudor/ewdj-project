<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(content=~{::content})}">
<head><title th:text="#{login.title}">Login</title></head>
<body>
<th:block th:fragment="content">
    <div class="auth-wrapper">
        <div class="auth-hero">
            <div class="auth-hero__trophy">&#9917;</div>
            <div class="auth-hero__title" th:text="#{home.title}">FIFA World Cup 2026</div>
            <div class="auth-hero__sub" th:text="#{home.subtitle}">The world's biggest football tournament</div>
        </div>
        <div class="auth-form-side">
            <div class="auth-form-box">
                <h1 th:text="#{login.title}">Login</h1>
                <p class="auth-subtitle" th:text="#{home.subtitle}">Sign in to make your predictions</p>
                <div th:if="${param.error}" class="alert-error" th:text="#{login.error}">Invalid username or password.</div>
                <div th:if="${param.registered}" class="success-msg" th:text="#{login.registered}">Registration successful!</div>
                <form th:action="@{/login}" method="post">
                    <label th:text="#{login.username.label}">Username</label>
                    <input type="text" name="username" required autocomplete="username"/>
                    <label th:text="#{login.password.label}">Password</label>
                    <input type="password" name="password" required autocomplete="current-password"/>
                    <button type="submit" class="btn" style="width:100%;margin-top:4px" th:text="#{login.submit}">Login</button>
                </form>
                <div class="auth-footer">
                    <span th:text="#{login.no.account}">Don't have an account?</span>
                    <a th:href="@{/register}" th:text="#{login.register.link}">Register here</a>
                </div>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
