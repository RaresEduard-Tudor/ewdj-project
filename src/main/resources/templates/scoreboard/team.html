<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(content=~{::content})}">
<head><title>Team Scoreboard</title></head>
<body>
<th:block th:fragment="content">
    <h1 th:text="${team.name} + ' — Scoreboard'">Team Scoreboard</h1>
    <table class="card">
        <thead>
        <tr>
            <th th:text="#{scoreboard.rank}">Rank</th>
            <th th:text="#{scoreboard.member}">Member</th>
            <th th:text="#{scoreboard.score}">Score</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="entry, stat : ${scores}">
            <td>
                <span th:if="${stat.count == 1}" class="medal medal--gold">&#127942;</span>
                <span th:if="${stat.count == 2}" class="medal medal--silver">&#129352;</span>
                <span th:if="${stat.count == 3}" class="medal medal--bronze">&#129353;</span>
                <span th:if="${stat.count > 3}" class="rank-badge" th:text="${stat.count}"></span>
            </td>
            <td th:text="${entry.key.username}"></td>
            <td class="pts-cell" th:text="${entry.value}"></td>
        </tr>
        </tbody>
    </table>
    <a th:href="@{/team/{id}(id=${team.id})}" class="btn" style="margin-top:16px" th:text="#{scoreboard.back.to.team}">Back to Team</a>
</th:block>
</body>
</html>
