<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      th:replace="~{layout :: layout(content=~{::content})}">
<head><title>Home</title></head>
<body>
<th:block th:fragment="content">

    <!-- Hero -->
    <div class="hero">
        <div class="hero__trophy">🏆</div>
        <h1 class="hero__title" th:text="#{home.title}">FIFA World Cup 2026</h1>
        <p class="hero__sub" th:text="#{home.subtitle}">The world's biggest football tournament</p>
        <div class="hero__stats">
            <div class="hero__stat"><span th:text="#{home.stat.teams}">48 Teams</span></div>
            <div class="hero__stat"><span th:text="#{home.stat.groups}">12 Groups</span></div>
            <div class="hero__stat"><span th:text="#{home.stat.hosts}">3 Host Nations</span></div>
            <div class="hero__stat"><span th:text="#{home.stat.matches}">104 Matches</span></div>
        </div>
        <div class="hero__actions">
            <a th:href="@{/groups}"  class="btn btn-gold"  th:text="#{home.view.groups}">View All Groups</a>
            <a th:href="@{/matches}" class="btn btn-outline" th:text="#{home.view.all.matches}">View All Matches</a>
        </div>
    </div>

    <!-- Upcoming matches -->
    <h2 th:text="#{home.upcoming}" style="margin-bottom:16px">Upcoming Matches</h2>

    <div th:if="${#lists.isEmpty(upcomingMatches)}" class="card">
        <p th:text="#{home.no.upcoming}">No upcoming matches.</p>
    </div>

    <div th:if="${!#lists.isEmpty(upcomingMatches)}">
        <div th:each="match : ${upcomingMatches}" class="match-card">
            <div class="match-card__date">
                <span th:text="${#temporals.format(match.matchDate, 'dd MMM')}"></span>
                <small th:text="${#temporals.format(match.matchDate, 'HH:mm')}"></small>
            </div>
            <div class="match-card__teams">
                <span class="team-name">
                    <span th:text="${@flagUtil.get(match.countryA)}"></span>
                    <span th:text="${match.countryA}"></span>
                </span>
                <span class="vs-badge">vs</span>
                <span class="team-name">
                    <span th:text="${@flagUtil.get(match.countryB)}"></span>
                    <span th:text="${match.countryB}"></span>
                </span>
            </div>
            <div class="match-card__meta">
                <span th:text="${match.city}"></span>
                <span class="dot">·</span>
                <span th:text="${match.stadium}"></span>
            </div>
            <div class="match-card__action">
                <span class="badge badge-upcoming" th:text="#{badge.upcoming}">Upcoming</span>
                <a th:href="@{/matches/{id}(id=${match.id})}" class="btn btn-sm" th:text="#{badge.predict}">Predict</a>
            </div>
        </div>
        <div style="margin-top:12px">
            <a th:href="@{/matches}" class="btn" th:text="#{home.view.all.matches}">View All Matches</a>
        </div>
    </div>

</th:block>
</body>
</html>
