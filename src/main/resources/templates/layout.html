<!DOCTYPE html>
<html th:fragment="layout(content)"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${pageTitle} ?: 'FIFA World Cup 2026'">FIFA World Cup 2026</title>
    <link rel="icon" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'&gt;&lt;text y='.9em' font-size='90'&gt;⚽&lt;/text&gt;&lt;/svg&gt;"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<nav>
    <div class="nav-left">
        <a th:href="@{/}"><strong>WC2026</strong></a>
        <a th:href="@{/matches}" th:text="#{nav.matches}">Matches</a>
        <a th:href="@{/groups}"  th:text="#{nav.groups}">Groups</a>
        <a th:href="@{/top10}" th:text="#{nav.top10}">Top 10</a>
    </div>

    <button class="nav-toggle" onclick="document.querySelector('.nav-links').classList.toggle('open')" aria-label="Menu">&#9776;</button>

    <div class="nav-links">
        <div class="nav-right">
            <span sec:authorize="isAuthenticated()">
                <a th:href="@{/team}"         th:text="#{nav.my.teams}">My Teams</a>
                <a th:href="@{/predictions}"  th:text="#{nav.predictions}">My Predictions</a>
                <span sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/admin/matches}" th:text="#{nav.admin}">Manage Matches</a>
                </span>
                <span class="nav-user">
                    <span class="nav-user__avatar" sec:authentication="name"
                          th:text="${#strings.substring(#authentication?.name ?: '', 0, 1)}">U</span>
                    <span sec:authentication="name"></span>
                </span>
                <form th:action="@{/logout}" method="post" style="display:inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" th:text="#{nav.logout}">Logout</button>
                </form>
            </span>

            <span sec:authorize="!isAuthenticated()">
                <a th:href="@{/login}"    th:text="#{nav.login}">Login</a>
                <a th:href="@{/register}" th:text="#{nav.register}">Register</a>
            </span>
            <span class="nav-lang">
                <a th:href="@{''(lang='en')}">EN</a>
                <span>|</span>
                <a th:href="@{''(lang='nl')}">NL</a>
            </span>
        </div>
    </div>
</nav>

<div class="container">
    <div th:replace="${content}"><!-- page content --></div>
</div>

<script>
    // Form submit loading state: adds .loading to the submit button after click
    document.addEventListener('submit', e => {
        const btn = e.target.querySelector('button[type="submit"]');
        if (btn && !btn.classList.contains('no-loading')) {
            setTimeout(() => btn.classList.add('loading'), 0);
        }
    });
</script>
</body>
</html>
