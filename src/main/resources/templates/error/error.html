<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(content=~{::content})}">
<head><title>Error</title></head>
<body>
<th:block th:fragment="content">
    <div class="card alert-error">
        <h1 th:text="#{error.generic.title}">Something went wrong</h1>
        <p th:text="${error}">An error occurred.</p>
        <p th:if="${deadline}">
            <span th:text="#{error.deadline.was(${#temporals.format(deadline, 'dd/MM/yyyy HH:mm')})}"></span>
        </p>
        <a th:href="@{/}" class="btn" style="margin-top:16px" th:text="#{error.go.home}">Go Home</a>
    </div>
</th:block>
</body>
</html>
