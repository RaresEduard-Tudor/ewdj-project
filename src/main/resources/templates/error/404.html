<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(content=~{::content})}">
<head><title>404 Not Found</title></head>
<body>
<th:block th:fragment="content">
    <div class="card" style="text-align:center">
        <h1 th:text="#{error.404.title}">404 — Page Not Found</h1>
        <p th:text="#{error.404.message}">The page you're looking for doesn't exist.</p>
        <a th:href="@{/}" class="btn" style="margin-top:16px" th:text="#{error.go.home}">Go Home</a>
    </div>
</th:block>
</body>
</html>
