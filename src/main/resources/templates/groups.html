<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(content=~{::content})}">
<head><title>Groups</title></head>
<body>
<th:block th:fragment="content">
    <h1 th:text="#{groups.title}">FIFA World Cup 2026 Groups</h1>

    <div class="groups-grid">
        <div th:each="entry : ${standings}" class="group-card card">

            <!-- Header -->
            <div class="group-card__header">
                <span class="group-label" th:text="#{groups.group.label(${entry.key})}">Group A</span>
            </div>

            <!-- Standings table -->
            <table class="standing-table">
                <thead>
                <tr>
                    <th th:text="#{groups.col.pos}">#</th>
                    <th th:text="#{groups.col.team}">Team</th>
                    <th th:text="#{groups.col.w}"   title="Wins">W</th>
                    <th th:text="#{groups.col.d}"   title="Draws">D</th>
                    <th th:text="#{groups.col.l}"   title="Losses">L</th>
                    <th th:text="#{groups.col.gf}"  title="Goals scored">GF</th>
                    <th th:text="#{groups.col.gd}"  title="Goal difference">GD</th>
                    <th th:text="#{groups.col.pts}" title="Points">Pts</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="team, stat : ${entry.value}"
                    th:class="${stat.index < 2} ? 'standing-advance' : ''">
                    <td class="pos-cell" th:text="${stat.count}"></td>
                    <td class="team-cell">
                        <span class="flag" th:text="${team.flag}"></span>
                        <span th:text="${team.name}"></span>
                    </td>
                    <td th:text="${team.won}"></td>
                    <td th:text="${team.drawn}"></td>
                    <td th:text="${team.lost}"></td>
                    <td th:text="${team.goalsFor}"></td>
                    <td th:text="${team.goalDiff > 0} ? '+' + ${team.goalDiff} : ${team.goalDiff}"></td>
                    <td class="pts-cell" th:text="${team.points}"></td>
                </tr>
                </tbody>
            </table>

            <!-- Next fixture -->
            <div th:if="${nextFixtures[entry.key] != null}" class="next-fixture">
                <span class="next-fixture__label" th:text="#{groups.next.fixture}">Next fixture</span>
                <span class="next-fixture__match">
                    <span th:text="${@flagUtil.get(nextFixtures[entry.key].countryA)}"></span>
                    <span th:text="${nextFixtures[entry.key].countryA}"></span>
                    <span class="vs-sep">vs</span>
                    <span th:text="${@flagUtil.get(nextFixtures[entry.key].countryB)}"></span>
                    <span th:text="${nextFixtures[entry.key].countryB}"></span>
                </span>
                <span class="next-fixture__date"
                      th:text="${#temporals.format(nextFixtures[entry.key].matchDate, 'dd MMM, HH:mm')}"></span>
            </div>

        </div>
    </div>
</th:block>
</body>
</html>
