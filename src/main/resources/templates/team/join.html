<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(content=~{::content})}">
<head><title>Join Team</title></head>
<body>
<th:block th:fragment="content">
    <div class="card" style="max-width:400px">
        <h1 th:text="#{team.join.title}">Join a Team</h1>
        <form th:action="@{/team/join}" method="post">
            <label th:text="#{team.invite.label}">Invite code</label>
            <input type="text" name="inviteCode" required/>
            <button type="submit" class="btn" th:text="#{team.join.submit}">Join Team</button>
        </form>
    </div>
</th:block>
</body>
</html>
