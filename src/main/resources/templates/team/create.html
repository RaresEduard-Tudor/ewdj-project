<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(content=~{::content})}">
<head><title>Create Team</title></head>
<body>
<th:block th:fragment="content">
    <div class="card" style="max-width:400px">
        <h1 th:text="#{team.create.title}">Create a Team</h1>
        <form th:action="@{/team/create}" method="post">
            <label th:text="#{team.name.label}">Team name</label>
            <input type="text" name="name" required/>
            <button type="submit" class="btn" th:text="#{team.create.submit}">Create Team</button>
        </form>
    </div>
</th:block>
</body>
</html>
