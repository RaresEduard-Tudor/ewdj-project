<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(content=~{::content})}">
<head><title>Team</title></head>
<body>
<th:block th:fragment="content">

    <!-- Flash messages -->
    <div th:if="${successMessage}" class="success-msg flash-msg" th:text="#{${successMessage}}"></div>
    <div th:if="${errorMessage}"   class="error-msg   flash-msg" th:text="#{${errorMessage}}"></div>

    <div class="team-page-grid">
        <!-- Main column -->
        <div>
            <div class="card">
                <h1 th:text="${team.name}" style="margin-bottom:6px">Team Name</h1>
                <p class="muted-note" th:text="#{team.members.count(${#lists.size(team.members)})}">members</p>

                <!-- Invite code (owner only) -->
                <div th:if="${currentUser == team.owner.username}" class="invite-row" style="margin-top:16px">
                    <span>
                        <strong th:text="#{team.invite.code}">Invite code</strong>:
                        <code class="invite-code" th:text="${team.inviteCode}"></code>
                    </span>
                    <form th:action="@{/team/{id}/regenerate(id=${team.id})}" method="post" style="display:inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-sm btn-warning" th:text="#{team.regenerate}">Regenerate</button>
                    </form>
                </div>

                <!-- Members -->
                <h2 th:text="#{team.members}" style="margin-top:24px">Members</h2>
                <p class="muted-note" th:text="#{team.breakdown.hint}">Click a member to see their per-match points.</p>
                <ul class="member-list">
                    <li th:each="member : ${team.members}" class="member-list__item">
                        <button type="button" class="member-name-col member-name-col--btn"
                                th:attr="data-member-id=${member.id}"
                                onclick="openMemberBreakdown(this)">
                            <span th:text="${member.username}"></span>
                            <span th:if="${member.username == team.owner.username}" class="owner-badge" th:text="#{team.owner.badge}">Owner</span>
                        </button>
                        <span class="member-score" th:text="${memberScores[member.id]} + ' ' + #{points.badge}">0 pts</span>
                        <form th:if="${currentUser == team.owner.username and member.username != team.owner.username}"
                              th:action="@{/team/{id}/remove/{mid}(id=${team.id},mid=${member.id})}"
                              method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-sm btn-danger" th:text="#{team.remove.member}">Remove</button>
                        </form>
                    </li>
                </ul>

                <!-- Per-member breakdown panels (hidden, opened from member click) -->
                <div th:each="member : ${team.members}"
                     th:id="'breakdown-' + ${member.id}"
                     class="modal-overlay"
                     onclick="if(event.target===this) closeMemberBreakdown(this)">
                    <div class="modal-box modal-box--slim" onclick="event.stopPropagation()">
                        <button class="modal-close" type="button" onclick="closeMemberBreakdown(this.parentElement.parentElement)">&times;</button>
                        <h3 style="margin:0 0 4px 0">
                            <span th:text="${member.username}"></span>
                            <span class="points-badge" style="margin-left:8px"
                                  th:text="${memberScores[member.id]} + ' ' + #{points.badge}">0 pts</span>
                        </h3>
                        <div class="muted-note" th:text="#{team.breakdown.title}" style="margin-bottom:12px">Points Breakdown</div>

                        <div th:if="${#lists.isEmpty(memberPredictions[member.id])}"
                             class="muted-note" th:text="#{team.breakdown.empty}">No predictions yet.</div>

                        <table th:if="${!#lists.isEmpty(memberPredictions[member.id])}" class="pred-table" style="width:100%">
                            <thead>
                            <tr>
                                <th th:text="#{prediction.col.match}">Match</th>
                                <th th:text="#{prediction.col.date}">Date</th>
                                <th th:text="#{prediction.col.mine}">My Prediction</th>
                                <th th:text="#{prediction.col.result}">Result</th>
                                <th th:text="#{prediction.col.points}">Points</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="p : ${memberPredictions[member.id]}">
                                <td>
                                    <span th:text="${@flagUtil.get(p.match.countryA)}"></span>
                                    <span th:text="${p.match.countryA}"></span>
                                    <span class="vs-sep" th:text="#{match.vs}">vs</span>
                                    <span th:text="${@flagUtil.get(p.match.countryB)}"></span>
                                    <span th:text="${p.match.countryB}"></span>
                                </td>
                                <td th:text="${#temporals.format(p.match.matchDate, 'dd MMM HH:mm')}"></td>
                                <td><strong th:text="${p.predictedGoalsA} + ' – ' + ${p.predictedGoalsB}"></strong></td>
                                <td th:text="${p.match.goalsA != null} ? ${p.match.goalsA} + ' – ' + ${p.match.goalsB} : #{prediction.tbd}">TBD</td>
                                <td>
                                    <span th:if="${p.pointsAwarded != null}" class="points-badge"
                                          th:text="${p.pointsAwarded} + ' ' + #{points.badge}"></span>
                                    <span th:if="${p.pointsAwarded == null}" class="muted-note">–</span>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <a th:href="@{/team/{id}/scoreboard(id=${team.id})}" class="btn" style="margin-top:16px" th:text="#{team.view.scoreboard}">View Scoreboard</a>
            </div>

            <!-- Owner settings -->
            <div th:if="${currentUser == team.owner.username}" class="card team-settings" style="margin-top:16px">
                <h2 th:text="#{team.settings.title}">Team Settings</h2>
                <form th:action="@{/team/{id}/settings(id=${team.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="settings-row">
                        <label class="toggle-label">
                            <input type="checkbox" name="inviteEnabled" th:checked="${team.inviteEnabled}"/>
                            <span th:text="#{team.settings.invites}">Allow joining via invite code</span>
                        </label>
                    </div>

                    <div class="settings-row">
                        <label th:for="maxMembers" th:text="#{team.settings.max.members}">Max members (0 = unlimited)</label>
                        <input type="number" id="maxMembers" name="maxMembers" min="0" max="100"
                               th:value="${team.maxMembers}" class="input-narrow"/>
                    </div>

                    <button type="submit" class="btn btn-sm btn-warning" th:text="#{team.settings.save}">Save Settings</button>
                </form>
            </div>
        </div>

        <!-- Sidebar -->
        <div class="team-sidebar">
            <div class="team-stat-card team-stat-card--accent">
                <div class="team-stat-card__label" th:text="#{team.total.score}">Total Score</div>
                <div class="team-stat-card__value" th:text="${totalScore}">0</div>
            </div>
            <div class="team-stat-card">
                <div class="team-stat-card__label" th:text="#{team.members}">Members</div>
                <div class="team-stat-card__value" th:text="${#lists.size(team.members)}">0</div>
            </div>
        </div>
    </div>

    <script>
        function openMemberBreakdown(btn) {
            const id = btn.dataset.memberId;
            const overlay = document.getElementById('breakdown-' + id);
            if (!overlay) return;
            overlay.classList.add('open');
            document.body.style.overflow = 'hidden';
        }
        function closeMemberBreakdown(overlay) {
            overlay.classList.remove('open');
            document.body.style.overflow = '';
        }
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                document.querySelectorAll('.modal-overlay.open').forEach(o => closeMemberBreakdown(o));
            }
        });
    </script>

</th:block>
</body>
</html>
