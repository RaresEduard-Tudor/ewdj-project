<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(content=~{::content})}">
<head><title>My Teams</title></head>
<body>
<th:block th:fragment="content">
    <h1 th:text="#{team.list.title}">My Teams</h1>

    <!-- Flash messages -->
    <div th:if="${successMessage}" class="success-msg flash-msg" th:text="#{${successMessage}}"></div>
    <div th:if="${errorMessage}"   class="error-msg   flash-msg" th:text="#{${errorMessage}}"></div>

    <!-- Team cards -->
    <div th:if="${!#lists.isEmpty(myTeams)}" class="teams-grid">
        <a th:each="team : ${myTeams}"
           th:href="@{/team/{id}(id=${team.id})}"
           class="team-card">
            <div class="team-card__name" th:text="${team.name}">Team Name</div>
            <div class="team-card__meta">
                <span th:text="#{team.members.count(${#lists.size(team.members)})}"></span>
                <span th:if="${team.owner.username == currentUser}" class="owner-badge" th:text="#{team.owner.badge}">Owner</span>
            </div>
        </a>
    </div>

    <div th:if="${#lists.isEmpty(myTeams)}" class="empty-state">
        <span class="empty-state__icon">👥</span>
        <div class="empty-state__title" th:text="#{team.list.empty}">You are not in any team yet.</div>
        <div class="empty-state__text" th:text="#{team.list.empty.hint}">Create your own team or join one with an invite code below.</div>
    </div>

    <!-- Create & Join forms side by side -->
    <div class="team-actions-row">
        <div class="card team-action-card">
            <h2 th:text="#{team.create.title}">Create a Team</h2>
            <form th:action="@{/team/create}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <label th:text="#{team.name.label}">Team name</label>
                <input type="text" name="name" required autocomplete="off"/>
                <button type="submit" class="btn" th:text="#{team.create.submit}">Create Team</button>
            </form>
        </div>

        <div class="card team-action-card">
            <h2 th:text="#{team.join.title}">Join a Team</h2>
            <form th:action="@{/team/join}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <label th:text="#{team.invite.label}">Invite code</label>
                <input type="text" name="inviteCode" required autocomplete="off"/>
                <button type="submit" class="btn" th:text="#{team.join.submit}">Join Team</button>
            </form>
        </div>
    </div>
</th:block>
</body>
</html>
