<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(content=~{::content})}">
<head><title>Admin - Matches</title></head>
<body>
<th:block th:fragment="content">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px">
        <h1 th:text="#{nav.admin}">Manage Matches</h1>
        <a th:href="@{/admin/matches/new}" class="btn" th:text="#{match.admin.add}">Add Match</a>
    </div>

    <div th:if="${successMessage}" class="success-msg" th:text="${successMessage}"></div>

    <table class="card admin-match-table">
        <thead>
        <tr>
            <th th:text="#{match.col.match}">Match</th>
            <th th:text="#{match.col.date}">Date</th>
            <th th:text="#{match.col.stadium}">Stadium</th>
            <th th:text="#{match.col.result}">Result</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="match : ${matches}"
            class="admin-match-row"
            th:attr="data-id=${match.id},
                     data-country-a=${match.countryA},
                     data-country-b=${match.countryB},
                     data-flag-a=${@flagUtil.get(match.countryA)},
                     data-flag-b=${@flagUtil.get(match.countryB)},
                     data-stadium=${match.stadium},
                     data-city=${match.city},
                     data-date=${#temporals.format(match.matchDate, 'dd MMM yyyy, HH:mm')},
                     data-has-result=${match.goalsA != null},
                     data-goals-a=${match.goalsA != null ? match.goalsA : 0},
                     data-goals-b=${match.goalsB != null ? match.goalsB : 0}"
            onclick="openDrawer(this)">
            <td>
                <span th:text="${@flagUtil.get(match.countryA)}"></span>
                <span th:text="${match.countryA}"></span>
                <span class="muted-note" th:text="#{match.vs}">vs</span>
                <span th:text="${@flagUtil.get(match.countryB)}"></span>
                <span th:text="${match.countryB}"></span>
            </td>
            <td th:text="${#temporals.format(match.matchDate, 'dd MMM HH:mm')}"></td>
            <td>
                <span th:text="${match.stadium}"></span>
                <span class="muted-note" th:text="'· ' + ${match.city}"></span>
            </td>
            <td>
                <span th:if="${match.goalsA != null}" th:text="${match.goalsA} + ' – ' + ${match.goalsB}"></span>
                <span th:if="${match.goalsA == null}" class="muted-note" th:text="#{prediction.tbd}">TBD</span>
            </td>
            <td onclick="event.stopPropagation()">
                <a th:href="@{/admin/matches/{id}/edit(id=${match.id})}"
                   class="btn btn-sm" th:text="#{match.admin.edit}">Edit Match</a>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- ── Drawer ──────────────────────────────────────────────── -->
    <div id="admin-drawer-overlay" class="admin-drawer-overlay" onclick="if(event.target===this) closeDrawer()">
        <div id="admin-drawer" class="admin-drawer">

            <div class="admin-drawer__header">
                <div>
                    <div class="admin-drawer__teams" id="dr-teams"></div>
                    <div class="admin-drawer__meta" id="dr-meta"></div>
                </div>
                <button class="admin-drawer__close" onclick="closeDrawer()" aria-label="Close">&#x2715;</button>
            </div>

            <!-- Set / update result -->
            <div class="admin-drawer__section">
                <h3 class="admin-drawer__section-title" th:text="#{match.admin.save.result}">Set Result</h3>
                <form id="dr-result-form" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div class="prediction-inputs" style="margin-bottom:16px">
                        <div class="prediction-input-group">
                            <label id="dr-label-a">A</label>
                            <input type="number" name="goalsA" id="dr-input-a" min="0" value="0" class="goal-input" required/>
                        </div>
                        <div class="prediction-sep">–</div>
                        <div class="prediction-input-group">
                            <label id="dr-label-b">B</label>
                            <input type="number" name="goalsB" id="dr-input-b" min="0" value="0" class="goal-input" required/>
                        </div>
                    </div>
                    <button type="submit" class="btn" style="width:100%" th:text="#{match.admin.save.result}">Save Result</button>
                </form>
            </div>

            <!-- Edit match details -->
            <div class="admin-drawer__section">
                <h3 class="admin-drawer__section-title" th:text="#{match.admin.edit}">Edit Match</h3>
                <a id="dr-edit-link" href="#" class="btn" style="width:100%;display:block;text-align:center;box-sizing:border-box"
                   th:text="#{match.admin.edit.details}">Edit Details</a>
            </div>

            <!-- Delete -->
            <div class="admin-drawer__section">
                <form id="dr-delete-form" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-danger" style="width:100%"
                            th:attr="onclick='return confirm(\'' + #{match.admin.delete.confirm} + '\')'">
                        <th:block th:text="#{match.admin.delete}">Delete</th:block>
                    </button>
                </form>
            </div>

        </div>
    </div>

    <script>
        function openDrawer(row) {
            const d = row.dataset;
            document.getElementById('dr-teams').innerHTML =
                d.flagA + ' ' + d.countryA + '  <span class="muted-note">vs</span>  ' + d.flagB + ' ' + d.countryB;
            document.getElementById('dr-meta').textContent = d.date + '  ·  ' + d.stadium + ', ' + d.city;
            document.getElementById('dr-label-a').textContent = d.countryA;
            document.getElementById('dr-label-b').textContent = d.countryB;
            document.getElementById('dr-input-a').value = d.goalsA || 0;
            document.getElementById('dr-input-b').value = d.goalsB || 0;
            document.getElementById('dr-result-form').action = '/admin/matches/' + d.id + '/result';
            document.getElementById('dr-edit-link').href = '/admin/matches/' + d.id + '/edit';
            document.getElementById('dr-delete-form').action = '/admin/matches/' + d.id + '/delete';

            document.querySelectorAll('.admin-match-row').forEach(r => r.classList.remove('active'));
            row.classList.add('active');

            document.getElementById('admin-drawer-overlay').classList.add('open');
        }

        function closeDrawer() {
            document.getElementById('admin-drawer-overlay').classList.remove('open');
            document.querySelectorAll('.admin-match-row').forEach(r => r.classList.remove('active'));
        }

        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
    </script>
</th:block>
</body>
</html>
