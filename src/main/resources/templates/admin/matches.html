<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(content=~{::content})}">
<head><title>Admin - Matches</title></head>
<body>
<th:block th:fragment="content">
    <h1 th:text="#{nav.admin}">Manage Matches</h1>
    <div th:if="${successMessage}" class="success-msg" th:text="${successMessage}"></div>
    <a th:href="@{/admin/matches/new}" class="btn" style="margin-bottom:16px" th:text="#{match.admin.add}">Add Match</a>
    <table class="card">
        <thead>
        <tr>
            <th th:text="#{match.col.match}">Match</th>
            <th th:text="#{match.col.date}">Date</th>
            <th th:text="#{match.col.stadium}">Stadium</th>
            <th th:text="#{match.col.code}">Code</th>
            <th th:text="#{match.col.result}">Result</th>
            <th th:text="#{match.col.actions}">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="match : ${matches}">
            <td>
                <span th:text="${@flagUtil.get(match.countryA)}"></span>
                <span th:text="${match.countryA}"></span>
                <span th:text="#{match.vs}">vs</span>
                <span th:text="${@flagUtil.get(match.countryB)}"></span>
                <span th:text="${match.countryB}"></span>
            </td>
            <td th:text="${#temporals.format(match.matchDate, 'dd MMM HH:mm')}"></td>
            <td th:text="${match.stadium}"></td>
            <td th:text="${match.stadiumCode}"></td>
            <td>
                <span th:if="${match.goalsA != null}" th:text="${match.goalsA} + ' – ' + ${match.goalsB}"></span>
                <span th:if="${match.goalsA == null}" class="muted-note" th:text="#{prediction.tbd}">TBD</span>
            </td>
            <td class="actions-cell">
                <a th:href="@{/admin/matches/{id}/edit(id=${match.id})}"
                   class="btn btn-sm" th:text="#{match.admin.edit}">Edit</a>
                <form th:action="@{/admin/matches/{id}/delete(id=${match.id})}" method="post" style="display:inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-sm btn-danger"
                            th:attr="onclick='return confirm(\'' + #{match.admin.delete.confirm} + '\')'">
                        <th:block th:text="#{match.admin.delete}">Delete</th:block>
                    </button>
                </form>
                <button th:if="${match.goalsA == null}"
                        class="btn btn-sm btn-warning"
                        th:attr="data-id=${match.id},
                                 data-country-a=${match.countryA},
                                 data-country-b=${match.countryB},
                                 data-flag-a=${@flagUtil.get(match.countryA)},
                                 data-flag-b=${@flagUtil.get(match.countryB)},
                                 data-date=${#temporals.format(match.matchDate, 'dd MMM yyyy HH:mm')}"
                        onclick="openResultModal(this)"
                        th:text="#{match.admin.save.result}">Save Result</button>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- Result modal -->
    <div id="result-modal" class="result-modal-overlay" onclick="if(event.target===this) closeResultModal()">
        <div class="result-modal">
            <div class="result-modal__header">
                <div class="result-modal__teams" id="rm-teams"></div>
                <div class="result-modal__date" id="rm-date"></div>
            </div>
            <div class="result-modal__body">
                <form id="result-form" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div class="prediction-inputs">
                        <div class="prediction-input-group">
                            <label id="rm-label-a">A</label>
                            <input type="number" name="goalsA" id="rm-input-a" min="0" value="0" class="goal-input" required/>
                        </div>
                        <div class="prediction-sep">–</div>
                        <div class="prediction-input-group">
                            <label id="rm-label-b">B</label>
                            <input type="number" name="goalsB" id="rm-input-b" min="0" value="0" class="goal-input" required/>
                        </div>
                    </div>
                    <div class="result-modal__actions">
                        <button type="submit" class="btn" th:text="#{match.admin.save.result}">Save Result</button>
                        <button type="button" class="btn" style="background:#888" onclick="closeResultModal()" th:text="#{form.cancel}">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        function openResultModal(btn) {
            const d = btn.dataset;
            document.getElementById('rm-teams').innerHTML =
                d.flagA + ' ' + d.countryA + '  vs  ' + d.flagB + ' ' + d.countryB;
            document.getElementById('rm-date').textContent = d.date;
            document.getElementById('rm-label-a').textContent = d.countryA;
            document.getElementById('rm-label-b').textContent = d.countryB;
            document.getElementById('rm-input-a').value = 0;
            document.getElementById('rm-input-b').value = 0;
            document.getElementById('result-form').action = '/admin/matches/' + d.id + '/result';
            document.getElementById('result-modal').classList.add('open');
            document.getElementById('rm-input-a').focus();
        }

        function closeResultModal() {
            document.getElementById('result-modal').classList.remove('open');
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeResultModal();
        });
    </script>
</th:block>
</body>
</html>
