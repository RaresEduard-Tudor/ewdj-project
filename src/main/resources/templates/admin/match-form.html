<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(content=~{::content})}">
<head><title>Match Form</title></head>
<body>
<th:block th:fragment="content">
    <div class="card" style="max-width:600px">
        <h1 th:text="${matchDto.id != null} ? #{match.form.edit} : #{match.form.add}">Match Form</h1>
        <form th:action="@{/admin/matches}" th:object="${matchDto}" method="post">
            <div th:if="${#fields.hasGlobalErrors()}" class="alert-error">
                <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
            </div>
            <input type="hidden" th:field="*{id}"/>

            <label th:text="#{match.form.country.a}">Country A</label>
            <input type="text" th:field="*{countryA}"/>
            <div class="error-msg" th:if="${#fields.hasErrors('countryA')}" th:errors="*{countryA}"></div>

            <label th:text="#{match.form.country.b}">Country B</label>
            <input type="text" th:field="*{countryB}"/>
            <div class="error-msg" th:if="${#fields.hasErrors('countryB')}" th:errors="*{countryB}"></div>

            <label th:text="#{match.form.date}">Match Date</label>
            <input type="datetime-local" th:field="*{matchDate}"/>
            <div class="error-msg" th:if="${#fields.hasErrors('matchDate')}" th:errors="*{matchDate}"></div>

            <label th:text="#{match.form.city}">City</label>
            <input type="text" th:field="*{city}"/>

            <label th:text="#{match.form.stadium}">Stadium</label>
            <input type="text" th:field="*{stadium}"/>

            <label th:text="#{match.form.stadium.code}">Stadium Code (4 digits)</label>
            <input type="text" th:field="*{stadiumCode}" maxlength="4"/>
            <div class="error-msg" th:if="${#fields.hasErrors('stadiumCode')}" th:errors="*{stadiumCode}"></div>

            <label th:text="#{match.form.checksum}">Checksum (stadiumCode % 97)</label>
            <input type="number" th:field="*{checksum}"/>

            <button type="submit" class="btn" th:text="#{form.save}">Save</button>
            <a th:href="@{/admin/matches}" class="btn" style="background:#888" th:text="#{form.cancel}">Cancel</a>
        </form>
    </div>
</th:block>
</body>
</html>
