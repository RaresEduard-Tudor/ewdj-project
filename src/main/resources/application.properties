# Dev profile — switch ddl-auto to 'none' before submission
spring.datasource.url=jdbc:mysql://localhost:3306/worldcup
spring.datasource.username=root
spring.datasource.password=admin123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false
spring.messages.cache-duration=0

server.error.whitelabel.enabled=false
spring.mvc.throw-exception-if-no-handler-found=true

# WebClient base URL — points at own app so no external dependency is needed
server.port=9001

stadium.api.base-url=http://localhost:9001

# Scoring constants — loaded via @Value in ScoringService
scoring.exact=10
scoring.outcome=5
scoring.bonus.exact=5
scoring.bonus.outcome=3
