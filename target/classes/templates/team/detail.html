<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(content=~{::content})}">
<head><title>Team</title></head>
<body>
<th:block th:fragment="content">

    <!-- Flash messages -->
    <div th:if="${successMessage}" class="success-msg flash-msg" th:text="#{${successMessage}}"></div>
    <div th:if="${errorMessage}"   class="error-msg   flash-msg" th:text="#{${errorMessage}}"></div>

    <div class="card">
        <!-- Header row: team name + total score -->
        <div class="team-detail-header">
            <h1 th:text="${team.name}">Team Name</h1>
            <div class="team-score-pill">
                <span th:text="#{team.total.score}">Total Score</span>
                <strong th:text="${totalScore}">0</strong>
            </div>
        </div>

        <!-- Invite code (owner only) -->
        <div th:if="${currentUser == team.owner.username}" class="invite-row">
            <span>
                <strong th:text="#{team.invite.code}">Invite code</strong>:
                <code class="invite-code" th:text="${team.inviteCode}"></code>
            </span>
            <form th:action="@{/team/{id}/regenerate(id=${team.id})}" method="post" style="display:inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-sm btn-warning" th:text="#{team.regenerate}">Regenerate</button>
            </form>
        </div>

        <!-- Members -->
        <h2 th:text="#{team.members}">Members</h2>
        <ul class="member-list">
            <li th:each="member : ${team.members}" class="member-list__item">
                <span class="member-name-col">
                    <span th:text="${member.username}"></span>
                    <span th:if="${member.username == team.owner.username}" class="owner-badge" th:text="#{team.owner.badge}">Owner</span>
                </span>
                <span class="member-score" th:text="${memberScores[member.id]} + ' pts'">0 pts</span>
                <form th:if="${currentUser == team.owner.username and member.username != team.owner.username}"
                      th:action="@{/team/{id}/remove/{mid}(id=${team.id},mid=${member.id})}"
                      method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-sm btn-danger" th:text="#{team.remove.member}">Remove</button>
                </form>
            </li>
        </ul>

        <a th:href="@{/team/{id}/scoreboard(id=${team.id})}" class="btn" th:text="#{team.view.scoreboard}">View Scoreboard</a>
    </div>

    <!-- Owner settings (separate card) -->
    <div th:if="${currentUser == team.owner.username}" class="card team-settings">
        <h2 th:text="#{team.settings.title}">Team Settings</h2>
        <form th:action="@{/team/{id}/settings(id=${team.id})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="settings-row">
                <label class="toggle-label">
                    <input type="checkbox" name="inviteEnabled" th:checked="${team.inviteEnabled}"/>
                    <span th:text="#{team.settings.invites}">Allow joining via invite code</span>
                </label>
            </div>

            <div class="settings-row">
                <label th:for="maxMembers" th:text="#{team.settings.max.members}">Max members (0 = unlimited)</label>
                <input type="number" id="maxMembers" name="maxMembers" min="0" max="100"
                       th:value="${team.maxMembers}" class="input-narrow"/>
            </div>

            <button type="submit" class="btn btn-sm btn-warning" th:text="#{team.settings.save}">Save Settings</button>
        </form>
    </div>

</th:block>
</body>
</html>
