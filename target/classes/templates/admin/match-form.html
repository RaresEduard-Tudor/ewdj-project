<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(content=~{::content})}">
<head><title>Match Form</title></head>
<body>
<th:block th:fragment="content">
    <div class="card" style="max-width:600px">
        <h1 th:text="${matchDto.id != null} ? 'Edit Match' : 'Add Match'">Match Form</h1>
        <div th:if="${#fields.hasGlobalErrors()}" class="alert-error">
            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
        </div>
        <form th:action="@{/admin/matches}" th:object="${matchDto}" method="post">
            <input type="hidden" th:field="*{id}"/>

            <label>Country A</label>
            <input type="text" th:field="*{countryA}"/>
            <div class="error-msg" th:if="${#fields.hasErrors('countryA')}" th:errors="*{countryA}"></div>

            <label>Country B</label>
            <input type="text" th:field="*{countryB}"/>
            <div class="error-msg" th:if="${#fields.hasErrors('countryB')}" th:errors="*{countryB}"></div>

            <label>Match Date (yyyy-MM-ddTHH:mm)</label>
            <input type="datetime-local" th:field="*{matchDate}"/>
            <div class="error-msg" th:if="${#fields.hasErrors('matchDate')}" th:errors="*{matchDate}"></div>

            <label>City</label>
            <input type="text" th:field="*{city}"/>

            <label>Stadium</label>
            <input type="text" th:field="*{stadium}"/>

            <label>Stadium Code (4 digits)</label>
            <input type="text" th:field="*{stadiumCode}" maxlength="4"/>
            <div class="error-msg" th:if="${#fields.hasErrors('stadiumCode')}" th:errors="*{stadiumCode}"></div>

            <label>Checksum (stadiumCode % 97)</label>
            <input type="number" th:field="*{checksum}"/>

            <button type="submit" class="btn">Save</button>
            <a th:href="@{/admin/matches}" class="btn" style="background:#888">Cancel</a>
        </form>
    </div>
</th:block>
</body>
</html>
