<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(content=~{::content})}">
<head><title>Admin - Matches</title></head>
<body>
<th:block th:fragment="content">
    <h1 th:text="#{nav.admin}">Manage Matches</h1>
    <div th:if="${successMessage}" class="success-msg" th:text="${successMessage}"></div>
    <a th:href="@{/admin/matches/new}" class="btn" style="margin-bottom:16px" th:text="#{match.admin.add}">Add Match</a>
    <table class="card">
        <thead>
        <tr>
            <th th:text="#{match.col.match}">Match</th>
            <th th:text="#{match.col.date}">Date</th>
            <th th:text="#{match.col.stadium}">Stadium</th>
            <th th:text="#{match.col.code}">Code</th>
            <th th:text="#{match.col.result}">Result</th>
            <th th:text="#{match.col.actions}">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="match : ${matches}">
            <td>
                <span th:text="${@flagUtil.get(match.countryA)}"></span>
                <span th:text="${match.countryA}"></span>
                vs
                <span th:text="${@flagUtil.get(match.countryB)}"></span>
                <span th:text="${match.countryB}"></span>
            </td>
            <td th:text="${#temporals.format(match.matchDate, 'dd MMM HH:mm')}"></td>
            <td th:text="${match.stadium}"></td>
            <td th:text="${match.stadiumCode}"></td>
            <td>
                <span th:if="${match.goalsA != null}" th:text="${match.goalsA} + ' – ' + ${match.goalsB}"></span>
                <span th:if="${match.goalsA == null}" class="muted-note">TBD</span>
            </td>
            <td class="actions-cell">
                <a th:href="@{/admin/matches/{id}/edit(id=${match.id})}"
                   class="btn btn-sm" th:text="#{match.admin.edit}">Edit</a>
                <form th:action="@{/admin/matches/{id}/delete(id=${match.id})}" method="post" style="display:inline">
                    <button type="submit" class="btn btn-sm btn-danger"
                            th:attr="onclick='return confirm(\'' + #{match.admin.delete.confirm} + '\')'">
                        <th:block th:text="#{match.admin.delete}">Delete</th:block>
                    </button>
                </form>
                <form th:if="${match.goalsA == null}"
                      th:action="@{/admin/matches/{id}/result(id=${match.id})}" method="post"
                      class="result-inline-form">
                    <input type="number" name="goalsA" min="0" class="goal-input-sm" placeholder="A"/>
                    <span>–</span>
                    <input type="number" name="goalsB" min="0" class="goal-input-sm" placeholder="B"/>
                    <button type="submit" class="btn btn-sm" th:text="#{match.admin.save.result}">Save Result</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</th:block>
</body>
</html>
