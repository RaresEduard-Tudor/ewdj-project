<!DOCTYPE html>
<html th:fragment="layout(content)"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${pageTitle} ?: 'FIFA World Cup 2026'">FIFA World Cup 2026</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<nav>
    <a th:href="@{/}"><strong>WC2026</strong></a>
    <a th:href="@{/matches}" th:text="#{nav.matches}">Matches</a>
    <a th:href="@{/groups}"  th:text="#{nav.groups}">Groups</a>
    <a th:href="@{/top10}"   th:text="#{nav.top10}">Top 10</a>

    <span sec:authorize="isAuthenticated()">
        <a th:href="@{/team}"         th:text="#{nav.my.teams}">My Teams</a>
        <a th:href="@{/predictions}"  th:text="#{nav.predictions}">My Predictions</a>
        <span sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/admin/matches}" th:text="#{nav.admin}">Manage Matches</a>
        </span>
        <span>| <span sec:authentication="name"></span> |</span>
        <form th:action="@{/logout}" method="post" style="display:inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" th:text="#{nav.logout}">Logout</button>
        </form>
    </span>

    <span sec:authorize="!isAuthenticated()">
        <a th:href="@{/login}"    th:text="#{nav.login}">Login</a>
        <a th:href="@{/register}" th:text="#{nav.register}">Register</a>
    </span>
</nav>

<div class="container">
    <div th:replace="${content}"><!-- page content --></div>
</div>
</body>
</html>
